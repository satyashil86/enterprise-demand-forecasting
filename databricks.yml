# Databricks Asset Bundle for the Enterprise Demand Forecasting Platform.
# Phase 0/1 scope: setup + synthetic data job. Later phases append tasks to resources/jobs.
#   databricks bundle validate -t dev
#   databricks bundle deploy   -t dev
#   databricks bundle run      -t dev dfp_foundation
bundle:
  name: enterprise_demand_forecasting

variables:
  env:
    description: Logical environment (selects catalog in config/environment_config.yml)
    default: dev

include:
  - resources/*.yml

targets:
  dev:
    mode: development
    default: true
    variables:
      env: dev
    # workspace.host is taken from your Databricks CLI profile (databricks auth login).
  prod:
    mode: production
    variables:
      env: prod
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    # run_as a service principal in prod (configured in Phase 17/19):
    # run_as:
    #   service_principal_name: <application-id>
