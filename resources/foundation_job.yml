# Serverless job (Free Edition compatible: no cluster definitions, no job_clusters).
resources:
  jobs:
    dfp_foundation:
      name: "[${bundle.target}] dfp_foundation"
      max_concurrent_runs: 1
      parameters:
        - name: env
          default: ${var.env}
      tasks:
        - task_key: t00_setup
          notebook_task:
            notebook_path: ../src/00_setup.py
            base_parameters:
              env: "{{job.parameters.env}}"
          max_retries: 1
          min_retry_interval_millis: 60000
        - task_key: t01_synthetic_data
          depends_on:
            - task_key: t00_setup
          notebook_task:
            notebook_path: ../src/01_synthetic_data.py
            base_parameters:
              env: "{{job.parameters.env}}"
              overwrite: "false"
          max_retries: 0
        - task_key: t02_raw_ingestion
          depends_on:
            - task_key: t01_synthetic_data
          notebook_task:
            notebook_path: ../src/02_raw_ingestion.py
            base_parameters:
              env: "{{job.parameters.env}}"
              mode: incremental        # each run releases the next staged batch and ingests new files
          max_retries: 2
          min_retry_interval_millis: 60000
        - task_key: t03_silver_cleansing
          depends_on:
            - task_key: t02_raw_ingestion
          notebook_task:
            notebook_path: ../src/03_silver_cleansing.py
            base_parameters:
              env: "{{job.parameters.env}}"
              mode: run                # incremental via high-watermark; idempotent MERGE
          max_retries: 1
          min_retry_interval_millis: 60000
      # Scheduled micro-batches: un-pause to run every hour (serverless => availableNow per run).
      schedule:
        quartz_cron_expression: "0 0 * * * ?"
        timezone_id: Asia/Kolkata
        pause_status: PAUSED
